name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# Política dos gates:
#
# - `npm test` e `npm run build` BLOQUEIAM. São rápidos, determinísticos e
#   cobrem o que o PR pode partir.
# - `npm run lint` e `npm audit` são ADVISORY (`continue-on-error`): o repositório
#   já vinha com dívida antiga (ver docs/ci-debt.md) e um gate vermelho por
#   motivos alheios ao PR escondia os testes, porque o audit falhava primeiro e
#   os passos seguintes ficavam `skipped`. Continuam a correr e a imprimir tudo,
#   mas não bloqueiam até a dívida ser paga num PR próprio.
# - O E2E continua a publicar relatório, mas também é advisory: o build atual
#   não produz `dist/server.js` (o passo antigo arrancava um ficheiro que não
#   existe), por isso a suite não tem servidor para testar.
#
# Ordem importa: primeiro o que bloqueia, depois o que informa.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---------- gates bloqueantes ----------
      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # ---------- gate bloqueante ----------
      - name: npm audit (high+)
        run: npm audit --audit-level=high

      # ---------- advisory: ver docs/ci-debt.md ----------
      - name: Install Playwright + deps
        continue-on-error: true
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Start server & run E2E
        # Primeira execução real da suite: fica advisory nesta passagem para
        # vermos o resultado antes de a tornar bloqueante (ver docs/ci-debt.md §3).
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f dist-server/server.js ]; then
            echo "::error::dist-server/server.js não existe — 'npm run build' devia tê-lo produzido."
            exit 1
          fi
          echo "Starting server in background..."
          node dist-server/server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null | grep -q 200; then
              echo "Server ready on attempt $i"
              break
            fi
            sleep 3
          done
          echo "Running E2E tests..."
          set +e
          npx playwright test 2>&1 | tee e2e-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "E2E exit code: $EXIT_CODE"
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
        env:
          CI: true
          NODE_ENV: development
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Publica o relatório na branch ci-e2e-report — os logs/summaries do
      # Actions exigem login, e o repo é publico (leitura via raw.githubusercontent)
      - name: Publish E2E report
        if: failure()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            node scripts/e2e-failures-summary.mjs
            echo "### Log (ultimas 300 linhas)"
            echo '```'
            tail -n 300 e2e-output.log 2>/dev/null || echo "(sem e2e-output.log)"
            echo '```'
            echo "Run: $RUN_URL"
          } > e2e-report.md
          cp e2e-report.md "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-e2e-report
          git add e2e-report.md
          git commit -m "e2e report run ${{ github.run_id }}" --allow-empty
          git push --force origin ci-e2e-report
      - name: Debug logs
        if: failure()
        shell: bash
        run: |
          echo "=== Server log ==="
          cat /tmp/server.log 2>/dev/null || echo "(empty)"
          echo "=== Playwright report ==="
          ls -la playwright-report/ 2>/dev/null || echo "(empty)"
